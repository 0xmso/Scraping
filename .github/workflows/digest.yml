name: Daily Tech Digest

on:
  schedule:
    - cron: "0 13 * * *"   # 16:00 TSİ (UTC+3)
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser notion-client 'anthropic[bedrock]>=0.125' python-dotenv

      - name: Run digest
        env:
          # Amazon Bedrock (AWS credits). Falls back to ANTHROPIC_API_KEY if unset.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_ARTICLES_DB_ID: ${{ secrets.NOTION_ARTICLES_DB_ID }}
        run: python run_digest.py

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One open issue at a time — reopen/comment instead of filing a new
          # one on every failed run.
          existing=$(gh issue list --label automation-failure --state open \
            --search "Daily Tech Digest in:title" --json number -q '.[0].number')
          body="Çalışma başarısız: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "Daily Tech Digest başarısız oluyor" \
              --label automation-failure \
              --body "$body"
          fi
